version: '3.8'

services:
  # ===========================================================================
  # Frontend Application (Next.js 15.5.23)
  # ===========================================================================
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: asep-enterprise-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - asep-net

  # ===========================================================================
  # Backend API & Agent Orchestrator (FastAPI / LangGraph)
  # ===========================================================================
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: asep-enterprise-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://asep_user:asep_password@postgres:5432/asep_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=asep_neo4j_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - asep-net

  # ===========================================================================
  # Primary Database (PostgreSQL 16 with Row-Level Security)
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: asep-enterprise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asep_user
      POSTGRES_PASSWORD: asep_password
      POSTGRES_DB: asep_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asep_user -d asep_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - asep-net

  # ===========================================================================
  # Cache, State & PubSub (Redis 7)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: asep-enterprise-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass asep_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "asep_redis_password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - asep-net

  # ===========================================================================
  # Semantic Memory (Qdrant Vector Database)
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: asep-enterprise-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - asep-net

  # ===========================================================================
  # Procedural Memory & AST Graph (Neo4j Community)
  # ===========================================================================
  neo4j:
    image: neo4j:5.26-community
    container_name: asep-enterprise-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/asep_neo4j_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - asep-net

  # ===========================================================================
  # Observability & Metrics (Prometheus)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: asep-enterprise-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - asep-net

networks:
  asep-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  prometheus_data:
