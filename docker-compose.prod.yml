version: "3.9"

# =============================================================================
# ASEP — Production Docker Compose
# =============================================================================
# ONE-COMMAND PRODUCTION DEPLOYMENT:
#
#   cp .env.production .env
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Prerequisites:
#   - Docker 24+ and Docker Compose v2
#   - A filled-in .env file (copy from .env.example, fill ALL values)
#   - Ports 80 and 443 open on the host firewall
#   - A domain name pointed at this server's IP (for TLS)
#
# Services started:
#   traefik  — Reverse proxy with automatic Let's Encrypt TLS
#   backend  — FastAPI (uvicorn, 4 workers)
#   frontend — Next.js standalone server
#   postgres — PostgreSQL 16 (skip if using Neon managed)
#   redis    — Redis 7 (skip if using Upstash)
#   neo4j    — Neo4j 5 community edition
#   qdrant   — Qdrant vector database
# =============================================================================

x-common-env: &common-env
  TZ: UTC
  APP_ENV: production

networks:
  asep_net:
    driver: bridge
  sandbox_net:
    driver: bridge
    internal: true   # agent sandboxes cannot reach internet

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  traefik_certs:

services:

  # ---------------------------------------------------------------------------
  # Traefik — Reverse Proxy + Automatic TLS (Let's Encrypt)
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: asep_traefik
    restart: unless-stopped
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # Redirect all HTTP → HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - asep_net
    labels:
      - "traefik.enable=false"

  # ---------------------------------------------------------------------------
  # Backend — FastAPI (uvicorn, production workers)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: asep/backend:${APP_VERSION:-0.1.3}
    container_name: asep_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *common-env
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      APP_WORKERS: "4"
      APP_RELOAD: "false"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      NEO4J_URI: "bolt://neo4j:7687"
      QDRANT_HOST: "qdrant"
      QDRANT_PORT: "6333"
    volumes:
      # Docker socket so backend can spawn agent sandboxes
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - asep_net
      - sandbox_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      # WebSocket support
      - "traefik.http.routers.backend-ws.rule=Host(`${DOMAIN}`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.backend-ws.entrypoints=websecure"
      - "traefik.http.routers.backend-ws.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend-ws.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # ---------------------------------------------------------------------------
  # Frontend — Next.js standalone server
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    image: asep/frontend:${APP_VERSION:-0.1.3}
    container_name: asep_frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env
    environment:
      <<: *common-env
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "https://${DOMAIN}/api"
      NEXT_PUBLIC_WS_URL: "wss://${DOMAIN}/ws"
    networks:
      - asep_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # Comment out this service and set DATABASE_URL to Neon if using managed DB
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: asep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - asep_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ---------------------------------------------------------------------------
  # Redis 7
  # Comment out and set REDIS_URL to Upstash if using managed Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: asep_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - asep_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  # ---------------------------------------------------------------------------
  # Neo4j 5 Community Edition
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: asep_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "256m"
      NEO4J_dbms_memory_heap_max__size: "512m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - asep_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ---------------------------------------------------------------------------
  # Qdrant Vector Database
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: asep_qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - asep_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ---------------------------------------------------------------------------
  # Database Migration Job (runs once on deploy, then exits)
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: asep_migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    command: ["alembic", "upgrade", "head"]
    networks:
      - asep_net
