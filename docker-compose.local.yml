version: '3.8'

services:
  qdrant_local:
    image: qdrant/qdrant:latest
    container_name: asep-qdrant-local
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_local_data:/qdrant/storage
    restart: unless-stopped

  neo4j_local:
    image: neo4j:5-community
    container_name: asep-neo4j-local
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_local_data:/data
    restart: unless-stopped

  redis_local:
    image: redis:7-alpine
    container_name: asep-redis-local
    ports:
      - "6379:6379"
    volumes:
      - redis_local_data:/data
    restart: unless-stopped

volumes:
  qdrant_local_data:
  neo4j_local_data:
  redis_local_data:
