name: "auto-workflow-generator"
version: "1.0.0"
description: "Generate an automation workflow JSON."
author: "ASEP Core"
triggers: ["n8n workflow", "make.com workflow", "zapier zap", "airflow dag", "temporal workflow", "automate task", "workflow json", "automation pipeline"]
tags: ["automation", "workflow"]
risk_level: "low"
required_permissions: ["READ_ONLY"]
instructions: |
  1. Map trigger to workflow node (Webhook, Cron, Gmail).
  2. Map actions to workflow nodes (HTTP Request, Google Sheets, Slack).
  3. Create connections object linking nodes.
  4. Add error handling: "Continue on Fail" + Error Trigger Workflow.
  5. Use environment variables for all secrets.
  6. Output valid automation workflow JSON schema.
schema:
  type: "object"
  properties:
    task_description:
      type: "string"
prompt_template: "You are an automation expert. Generate a valid workflow JSON based on this task: {task_description}. No hardcoded secrets. Include error handling."
